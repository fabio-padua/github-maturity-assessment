name: Release Azure demo

on:
  workflow_call:
    inputs:
      source_sha:
        description: The latest main commit already verified by CI and the deployment gate.
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_RESOURCE_GROUP:
        required: true
      AZURE_CONTAINER_APP:
        required: true
      AZURE_CONTAINER_REGISTRY:
        required: true
      AZURE_IMAGE_REPOSITORY:
        required: true
      AZURE_APP_URL:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_APP: ${{ secrets.AZURE_CONTAINER_APP }}
      AZURE_CONTAINER_REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
      AZURE_IMAGE_REPOSITORY: ${{ secrets.AZURE_IMAGE_REPOSITORY }}
      ASSESSMENT_URL: ${{ secrets.AZURE_APP_URL }}
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
      sha: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check one-time Azure configuration
        run: node scripts/deployment.mjs configuration
      - name: Sign in with federated managed identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build a uniquely tagged demo image in ACR
        id: image
        shell: bash
        run: |
          set -euo pipefail
          tag="${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          status=$(az acr build \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --registry "$AZURE_CONTAINER_REGISTRY" \
            --image "${AZURE_IMAGE_REPOSITORY}:${tag}" \
            --file infra/Dockerfile \
            --build-arg "SOURCE_SHA=${SOURCE_SHA}" \
            --no-logs --query status --output tsv .)
          if [[ "$status" != "Succeeded" ]]; then
            echo "::error::ACR build did not succeed: $status"
            exit 1
          fi
          server=$(az acr show --name "$AZURE_CONTAINER_REGISTRY" \
            --subscription "$AZURE_SUBSCRIPTION_ID" --query loginServer --output tsv)
          digest=$(az acr repository show --name "$AZURE_CONTAINER_REGISTRY" \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --image "${AZURE_IMAGE_REPOSITORY}:${tag}" --query digest --output tsv)
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::ACR did not return a valid image digest."
            exit 1
          fi
          echo "image=${server}/${AZURE_IMAGE_REPOSITORY}@${digest}" >> "$GITHUB_OUTPUT"
      - name: Read the existing application configuration
        shell: bash
        run: |
          set -euo pipefail
          az resource show \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --resource-type Microsoft.App/containerApps \
            --name "$AZURE_CONTAINER_APP" --api-version 2026-07-01 \
            --output json > "$RUNNER_TEMP/container-app.json"
          az acr show --subscription "$AZURE_SUBSCRIPTION_ID" \
            --name "$AZURE_CONTAINER_REGISTRY" \
            --output json > "$RUNNER_TEMP/registry.json"
      - name: Prepare image-only Bicep parameters and validate ingress
        env:
          CONTAINER_IMAGE: ${{ steps.image.outputs.image }}
        run: node scripts/deployment.mjs parameters
      - name: Recheck main immediately before updating the Container App
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deployment.mjs current
      - name: Refresh ingress, deploy and verify the ready revision
        id: deploy
        if: steps.current.outputs.current == 'true'
        shell: bash
        env:
          CONTAINER_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          az resource show --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --resource-type Microsoft.App/containerApps \
            --name "$AZURE_CONTAINER_APP" --api-version 2026-07-01 \
            --output json > "$RUNNER_TEMP/container-app.json"
          node scripts/deployment.mjs parameters
          state=$(az deployment group create \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "demo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --template-file infra/deploy.bicep \
            --parameters "@${RUNNER_TEMP}/deploy.parameters.json" \
            --query properties.provisioningState --output tsv)
          if [[ "$state" != "Succeeded" ]]; then
            echo "::error::Container App deployment failed: $state"
            exit 1
          fi
          node scripts/deployment.mjs wait-ready

  smoke:
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ASSESSMENT_URL: ${{ secrets.AZURE_APP_URL }}
      SOURCE_SHA: ${{ needs.deploy.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.deploy.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify HTTPS and the served build commit
        run: node scripts/deployment.mjs health
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Exercise the actual deployed demo in all three languages
        run: npm run test:deployed
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deployed-demo-test-results
          path: test-results
          retention-days: 7
      - name: Record successful deployment
        shell: bash
        run: |
          {
            echo "### Azure demo deployed"
            echo "- Commit: \`$SOURCE_SHA\`"
            echo "- Endpoint: configured by the AZURE_APP_URL repository secret."
            echo "- HTTPS, build identity, language switching, reports and session-only behavior verified."
          } >> "$GITHUB_STEP_SUMMARY"
